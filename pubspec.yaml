name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Setup
        run: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/
          cp lib/main.dart /tmp/backup/

          rm -rf * .git* || true
          git init
          flutter create --org com.example --project-name mistake_book .

          cp /tmp/backup/pubspec.yaml ./
          cp /tmp/backup/main.dart ./lib/

          # Set Android SDK versions to modern standards (SDK 34)
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle || true

          # Safely inject Share Intent into AndroidManifest
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          intent_str = '''
                      <intent-filter>
                          <action android:name=\"android.intent.action.SEND\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <data android:mimeType=\"image/*\" />
                      </intent-filter>
                  </activity>'''
          if '<data android:mimeType=\"image/*\" />' not in content:
              content = content.replace('</activity>', intent_str, 1)
              with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
                  f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistake-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
