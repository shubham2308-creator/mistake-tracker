name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Rebuild Modern Android Folder
        run: |
          # 1. Delete the old Android folder that was causing V1 embedding errors
          rm -rf android/
          
          # 2. Tell Flutter to generate a brand new, modern Android configuration
          flutter create --platforms android .

      - name: Install Dependencies
        run: flutter pub get

      - name: Inject Android Share Intent Filter
        run: |
          # 3. Safely adds the share intent so the app appears in the Android Share menu
          awk '/<\/activity>/{if (!done) {print "            <intent-filter>\n                <action android:name=\"android.intent.action.SEND\" />\n                <category android:name=\"android.intent.category.DEFAULT\" />\n                <data android:mimeType=\"image/*\" />\n            </intent-filter>"; done=1}}1' android/app/src/main/AndroidManifest.xml > temp.xml
          mv temp.xml android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Generate Permanent Signature & Sign APK
        run: |
          # 4. Create a permanent deterministic keystore so future updates never lose data
          keytool -genkeypair -alias uploadkey -keypass android -keystore permanent.keystore -storepass android -dname "CN=MistakeBook,O=App,C=IN" -validity 10000 -keyalg RSA -keysize 2048
          
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS_PATH=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n1)
          
          # 5. Align the APK for Android OS
          $BUILD_TOOLS_PATH/zipalign -v -p 4 $APK_PATH aligned.apk
          
          # 6. Apply the permanent signature
          $BUILD_TOOLS_PATH/apksigner sign --ks permanent.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias uploadkey --out final-app.apk aligned.apk
          
          # 7. Overwrite original with the cleanly signed version
          mv final-app.apk $APK_PATH

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: mistake-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
