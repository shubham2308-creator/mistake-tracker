name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Permanent Signing Key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mistake-book-permanent-key-v3

      - name: Setup Permanent Signing Key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keypass android \
              -keystore ~/.android/debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" -validity 10000 \
              -keyalg RSA -keysize 2048
          fi

      - name: Setup Flutter App & Intent Filter
        run: |
          # Save user code
          mkdir -p /tmp/app_code
          cp lib/main.dart /tmp/app_code/main.dart

          # Create clean Flutter project
          flutter create --org com.example --project-name mistake_book /tmp/flutter_scaffold
          cp -r /tmp/flutter_scaffold/android ./
          cp /tmp/app_code/main.dart ./lib/main.dart

          # Add packages
          flutter pub add sqflite path_provider path receive_sharing_intent image_picker

          # Inject Share Intent safely into AndroidManifest
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = f.read()

          intent_block = '''
                      <intent-filter>
                          <action android:name=\"android.intent.action.SEND\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <data android:mimeType=\"image/*\" />
                      </intent-filter>
                  </activity>'''

          if 'android.intent.action.SEND' not in manifest and '</activity>' in manifest:
              manifest = manifest.replace('</activity>', intent_block, 1)
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(manifest)
          "

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistake-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
