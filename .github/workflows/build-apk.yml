name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Restore Permanent Keystore from Cache
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: upload-keystore.jks
          key: permanent-mistake-book-keystore-v1

      - name: Setup Project Structure & Dependencies
        run: |
          mkdir -p /tmp/app_code
          cp lib/main.dart /tmp/app_code/main.dart

          flutter create --org com.example --project-name mistake_book /tmp/flutter_scaffold
          cp -r /tmp/flutter_scaffold/android ./
          cp /tmp/app_code/main.dart ./lib/main.dart

          flutter pub add sqflite path_provider path receive_sharing_intent image_picker

      - name: Setup Permanent Signing Key
        run: |
          # If keystore was cached, restore it to android/app/
          if [ -f upload-keystore.jks ]; then
            cp upload-keystore.jks android/app/upload-keystore.jks
          else
            # Generate the permanent key once and save for caching
            keytool -genkeypair -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore android/app/upload-keystore.jks -storepass mistake_book_key_123 \
              -keypass mistake_book_key_123 -dname "CN=MistakeBook, O=MistakeBook, C=IN"
            cp android/app/upload-keystore.jks ./upload-keystore.jks
          fi

          cat << 'EOF' > android/key.properties
          storePassword=mistake_book_key_123
          keyPassword=mistake_book_key_123
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Configure Gradle and AndroidManifest
        run: |
          python3 - << 'EOF'
          # 1. Update android/app/build.gradle for permanent signing
          with open('android/app/build.gradle', 'r') as f:
              gradle = f.read()

          keystore_config = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
          """
          if 'keystoreProperties' not in gradle:
              gradle = gradle.replace('android {', keystore_config, 1)

          signing_config = """
              signingConfigs {
                  release {
                      keyAlias 'upload'
                      keyPassword 'mistake_book_key_123'
                      storeFile file('upload-keystore.jks')
                      storePassword 'mistake_book_key_123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          """
          if 'signingConfigs {' not in gradle:
              gradle = gradle.replace('buildTypes {', signing_config, 1)

          with open('android/app/build.gradle', 'w') as f:
              f.write(gradle)

          # 2. Add share intent filter to AndroidManifest.xml
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              manifest = f.read()

          intent_block = """
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                  </activity>"""

          if 'android.intent.action.SEND' not in manifest:
              manifest = manifest.replace('</activity>', intent_block, 1)
              with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
                  f.write(manifest)
          EOF

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistake-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
