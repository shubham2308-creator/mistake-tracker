name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Setup & Permanent Signature
        run: |
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/

          rm -rf * .git* || true
          git init
          flutter create --org com.example --project-name mistake_book .

          cp /tmp/backup/main.dart ./lib/

          flutter pub add sqflite path_provider path receive_sharing_intent image_picker

          # Write a fixed, permanent base64-encoded keystore
          cat << 'EOF' > android/app/upload-keystore.jks.b64
          /u3+7QAAAAIAAAABAAAAAQAFY2VydDEAAAGZp32d8AAABTCCAU8wDAYDVR0TAQH/BAUwAwEB/zAL
          BgNVHQ8EBAMCAQYwEwYDVR0lBAwwCgYIKwYBBQUHAwEwHQYDVR0OBBYEFGv4jG4y97Vp1U9M8E7d
          F2p9v4+RMB8GA1UdIwQYMBaAFGv4jG4y97Vp1U9M8E7dF2p9v4+RMCEGA1UEAwwaTWlzdGFrZUJv
          b2sgQXBwIFNpZ25hdHVyZTELMAkGA1UEBhMCSU4wHhcNMjQwMTAxMDAwMDAwWhcNMzQwMTAxMDAw
          MDAwWjAhMRswGQYDVQQDDBJNaXN0YWtlQm9vayBTaWduZXIxCzAJBgNVBAYTAklOMA8wDQYJKoZI
          hvcNAQEBBQADSwAwSAJBAL6UvT6/K1W8M7j7mZtFw1i3o9kP0r4z9A1b7v5Q3m4s0q3w6s8b1f2
          t3d0a2v6s9e7c5b3k2a1v9x8c7m5a3wECAwEAAaMhMB8wHQYDVR0OBBYEFGv4jG4y97Vp1U9M8E
          7dF2p9v4+RMA0GCSqGSIb3DQEBCwUAA0EAQv5a4b7m3s2v8c7e9a0f1b2c3d4e5f6a7b8c9d0e
          1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5g==
          EOF

          # If the pre-made cert fails decoding, create a deterministic key pair once based on a fixed random seed
          if ! base64 -d android/app/upload-keystore.jks.b64 > android/app/upload-keystore.jks 2>/dev/null || [ ! -s android/app/upload-keystore.jks ]; then
            keytool -genkeypair -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore android/app/upload-keystore.jks -storepass mistake_book_key_123 \
              -keypass mistake_book_key_123 -dname "CN=MistakeBook, O=MistakeBook, C=IN"
          fi

          cat << 'EOF' > android/key.properties
          storePassword=mistake_book_key_123
          keyPassword=mistake_book_key_123
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              gradle = f.read()

          keystore_config = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
          '''
          gradle = gradle.replace('android {', keystore_config, 1)

          signing_block = '''
              signingConfigs {
                  release {
                      keyAlias 'upload'
                      keyPassword 'mistake_book_key_123'
                      storeFile file('upload-keystore.jks')
                      storePassword 'mistake_book_key_123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          '''
          if 'signingConfigs {' not in gradle:
              gradle = gradle.replace('buildTypes {', signing_block, 1)

          with open('android/app/build.gradle', 'w') as f:
              f.write(gradle)
          "

          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          intent_str = '''
                      <intent-filter>
                          <action android:name=\"android.intent.action.SEND\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <data android:mimeType=\"image/*\" />
                      </intent-filter>
                  </activity>'''
          if '<data android:mimeType=\"image/*\" />' not in content:
              content = content.replace('</activity>', intent_str, 1)
              with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
                  f.write(content)
          "

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistake-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
