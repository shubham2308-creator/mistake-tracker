name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.22.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Setup Permanent Signing Certificate
        run: |
          mkdir -p ~/.android
          # Generate deterministic private key & certificate pair
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/app_key.pem -out /tmp/app_cert.pem \
            -days 10000 -nodes -subj "/CN=MistakeBookApp/O=MistakeBook/C=IN" -batch

          # Export to standard Android debug keystore format
          openssl pkcs12 -export -in /tmp/app_cert.pem -inkey /tmp/app_key.pem \
            -out ~/.android/debug.keystore -name androiddebugkey -passout pass:android

      - name: Scaffold & Configure Android
        run: |
          # 1. Back up main.dart
          mkdir -p /tmp/backup
          cp lib/main.dart /tmp/backup/main.dart

          # 2. Generate clean project structure
          flutter create --org com.example --project-name mistake_book .
          cp /tmp/backup/main.dart ./lib/main.dart

          # 3. Add required dependencies
          flutter pub add sqflite path_provider path receive_sharing_intent image_picker

          # 4. Set required SDK versions in android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle || true

          # 5. Enable AndroidX and Jetifier in gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 6. Safely inject Share Intent filter into AndroidManifest.xml
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              manifest = f.read()

          intent_block = '''
                      <intent-filter>
                          <action android:name=\"android.intent.action.SEND\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <data android:mimeType=\"image/*\" />
                      </intent-filter>
                  </activity>'''

          if 'android.intent.action.SEND' not in manifest and '</activity>' in manifest:
              manifest = manifest.replace('</activity>', intent_block, 1)
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(manifest)
          "

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistake-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
