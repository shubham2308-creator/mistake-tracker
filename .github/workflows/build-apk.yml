name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Project Structure & Dependencies
        run: |
          mkdir -p /tmp/app_code
          cp lib/main.dart /tmp/app_code/main.dart

          flutter create --org com.example --project-name mistake_book /tmp/flutter_scaffold
          cp -r /tmp/flutter_scaffold/android ./
          cp /tmp/app_code/main.dart ./lib/main.dart

          flutter pub add sqflite path_provider path receive_sharing_intent image_picker

      - name: Setup Permanent Signing Key
        run: |
          mkdir -p ~/.android
          mkdir -p android/app

          # Create permanent keystore with fixed credentials
          keytool -genkeypair -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore android/app/upload-keystore.jks -storepass mistake_book_key_123 \
            -keypass mistake_book_key_123 -dname "CN=MistakeBook, O=MistakeBook, C=IN"

          # Mirror to debug keystore location for seamless fallback
          cp android/app/upload-keystore.jks ~/.android/debug.keystore

      - name: Configure Manifest and Build Files
        run: |
          python3 -c "
          import os

          # 1. Safely add Share Intent to AndroidManifest.xml
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  manifest = f.read()

              intent_block = '''
                      <intent-filter>
                          <action android:name=\"android.intent.action.SEND\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <data android:mimeType=\"image/*\" />
                      </intent-filter>
                  </activity>'''

              if 'android.intent.action.SEND' not in manifest and '</activity>' in manifest:
                  manifest = manifest.replace('</activity>', intent_block, 1)
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(manifest)

          # 2. Configure permanent signing in Groovy or Kotlin DSL
          gradle_groovy = 'android/app/build.gradle'
          gradle_kotlin = 'android/app/build.gradle.kts'

          if os.path.exists(gradle_groovy):
              with open(gradle_groovy, 'r', encoding='utf-8') as f:
                  gradle = f.read()
              if 'signingConfigs {' not in gradle and 'buildTypes {' in gradle:
                  signing = '''
              signingConfigs {
                  release {
                      keyAlias 'upload'
                      keyPassword 'mistake_book_key_123'
                      storeFile file('upload-keystore.jks')
                      storePassword 'mistake_book_key_123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          '''
                  gradle = gradle.replace('buildTypes {', signing, 1)
                  with open(gradle_groovy, 'w', encoding='utf-8') as f:
                      f.write(gradle)

          elif os.path.exists(gradle_kotlin):
              with open(gradle_kotlin, 'r', encoding='utf-8') as f:
                  gradle = f.read()
              if 'signingConfigs {' not in gradle and 'buildTypes {' in gradle:
                  signing = '''
              signingConfigs {
                  create(\"release\") {
                      keyAlias = \"upload\"
                      keyPassword = \"mistake_book_key_123\"
                      storeFile = file(\"upload-keystore.jks\")
                      storePassword = \"mistake_book_key_123\"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName(\"release\")
                  }
              }
          '''
                  gradle = gradle.replace('buildTypes {', signing, 1)
                  with open(gradle_kotlin, 'w', encoding='utf-8') as f:
                      f.write(gradle)
          "

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistake-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
