name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Clean Flutter Project
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          
          rm -rf android/
          flutter create --org com.example --project-name mistake_book .
          
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          
          flutter pub get

      - name: Configure Android Enforcements
        run: |
          # Target Kotlin DSL (build.gradle.kts)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' android/app/build.gradle.kts || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle.kts || true
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' android/app/build.gradle.kts || true

          # Target Groovy DSL (build.gradle)
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/' android/app/build.gradle || true

          # Enable AndroidX and Jetifier
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # Safely inject the Share Intent filter
          python3 -c "
          import os
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  manifest = f.read()

              intent_block = '''
                      <intent-filter>
                          <action android:name=\"android.intent.action.SEND\" />
                          <category android:name=\"android.intent.category.DEFAULT\" />
                          <data android:mimeType=\"image/*\" />
                      </intent-filter>
                  </activity>'''

              if 'android.intent.action.SEND' not in manifest:
                  manifest = manifest.replace('</activity>', intent_block, 1)
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(manifest)
          "

      - name: Generate Permanent Signing Key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -alias uploadkey -keypass android -keystore ~/.android/permanent.keystore -storepass android -dname "CN=MistakeBook,O=App,C=IN" -validity 10000 -keyalg RSA -keysize 2048

      - name: Build Unsigned APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Manually Sign APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_TOOLS_PATH=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n1)
          
          # Align APK for Android OS compatibility
          $BUILD_TOOLS_PATH/zipalign -v -p 4 $APK_PATH aligned.apk
          
          # Force signature using the permanent key
          $BUILD_TOOLS_PATH/apksigner sign --ks ~/.android/permanent.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias uploadkey --out signed.apk aligned.apk
          
          # Replace the original file
          mv signed.apk $APK_PATH

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mistake-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
